[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holo-openset"
version = "1.0.0"
description = "Open-set recognition of interference patterns on raw lensless holograms with a learnable Fourier layer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-only" }

[tool.setuptools.packages.find]
include = ["holo_openset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
